# Runtime configuration for the SalesOps agent. Secrets stay in .env.
version: 1.8.0

agent:
  prompt:
    name: salesops_system
    version: v1

model:
  name: gpt-4.1-mini
  temperature: 0

tools:
  version: 1.1.0
  schema_version: v1
  enabled:
    - lookup_account
    - lookup_account_context
    - list_open_opportunities
    - summarize_pipeline
    - run_crm_analysis
    - lookup_internal_hr_data
    - lookup_internal_financial_data
    - draft_email
    - send_email

guardrails:
  input_policy_version: v1
  tool_policy_version: v2
  output_policy_version: v1

# Limits for run_crm_analysis. The timeout includes starting the sandbox process.
sandbox:
  timeout_seconds: 10
  max_output_chars: 4000

# Logging and tracing. Cost rates are estimates (OpenAI list prices for gpt-4.1-mini,
# USD per 1,000 tokens); replace them with your provider's rates.
observability:
  cost_per_1k_input_tokens: 0.0004
  cost_per_1k_output_tokens: 0.0016
  max_trace_output_chars: 2000
  # The monitoring report flags runs that call the model and cost more than this on average.
  cost_alert_per_run_usd: 0.05
  # Fields whose values are always replaced in logs and traces, on top of the tool
  # policy's restricted fields. A name ending in "_" matches as a prefix.
  redact_fields:
    - quarterly_summary
    - revenue_usd
    - runway_months
    - salary_usd
    - equity_bonus_usd
    - performance_status
    - confidential_strategy
    - CONFIDENTIAL_

# Relative paths resolve from the project root.
paths:
  crm_data: data/crm
  restricted_data: data/restricted
  outbox: data/outbox/email_outbox.json
  prompts: prompts
  guardrails: config/guardrails
  logs: logs
  traces: traces
  reports: reports
  evaluation_tasks: data/evaluation/golden_tasks.csv
