[project]
name = "salesops-agent"
version = "0.1.0"
description = "Production-oriented SalesOps agent for UdaCenture's CRM data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "pydantic>=2.11",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["starter"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
